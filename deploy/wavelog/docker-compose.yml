# Wavelog logbook — pasta e porta isoladas do Ham Cockpit.
# Instalar em: /opt/wavelog
# LAN: http://<pi-ip>:8086   instalador: /install
# NÃO publique 3306. NÃO coloque isso em /opt/ham-cockpit nem na porta 80.

name: wavelog

services:
  wavelog-db:
    image: mariadb:11.8
    container_name: wavelog-db
    env_file:
      - .env
    environment:
      MARIADB_RANDOM_ROOT_PASSWORD: "yes"
      MARIADB_DATABASE: wavelog
      MARIADB_USER: wavelog
      MARIADB_PASSWORD: ${WAVELOG_DB_PASSWORD:?set WAVELOG_DB_PASSWORD in .env}
    volumes:
      - wavelog-dbdata:/var/lib/mysql
    # Pi com 1 GB: MariaDB padrão chega a ~115 MB RSS com performance_schema.
    command:
      - --innodb-buffer-pool-size=64M
      - --performance-schema=OFF
      - --max-connections=40
      - --key-buffer-size=8M
      - --tmp-table-size=16M
      - --max-heap-table-size=16M
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
    networks:
      - wavelog

  wavelog-main:
    image: ${WAVELOG_IMAGE:-ghcr.io/wavelog/wavelog:latest}
    container_name: wavelog-main
    depends_on:
      wavelog-db:
        condition: service_healthy
    environment:
      CI_ENV: docker
    volumes:
      - wavelog-config:/var/www/html/application/config/docker
      - wavelog-uploads:/var/www/html/uploads
      - wavelog-userdata:/var/www/html/userdata
    ports:
      - "8086:80"
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
    networks:
      - wavelog

volumes:
  wavelog-dbdata:
  wavelog-uploads:
  wavelog-userdata:
  wavelog-config:

networks:
  wavelog:
    name: wavelog
    driver: bridge
