# Mapa de serviços no mesmo Raspberry Pi 4 — pastas e portas distintas.
#
# Ham Cockpit OS  Raspberry Pi OS Lite 64-bit (Debian 12) · Pi 3 e Pi 4
# Ham Cockpit     /opt/ham-cockpit      TCP 80   (dev: 3000)
# Wavelog        /opt/wavelog         TCP 8086 -> container :80  (systemd wavelog.service no boot)
# MariaDB        volume docker        (não publicar 3306)
# WaveLogGate    /opt/wavelog-gate    UDP 2333 (QSO → log Wavelog), TCP 54321, TCP 54322
# ser2net        /opt/ser2net         TCP 127.0.0.1:4001–4005 (CI-V / amp cru)
# rigctld IC-705 hamlib-utils         TCP 4532  (-r 127.0.0.1:4001)
# rigctld CAT2   hamlib-utils         TCP 4534  (-r 127.0.0.1:4002)
# ampctld SPE    hamlib-utils         TCP 4531  (-r 127.0.0.1:4004)
# ACOM 2000A     ser2net              TCP 4005  1200 8N1 (sem ampctld)
# rotctld        hamlib-utils         TCP 4533  (opcional)
#
# Wavelog installer:  http://<pi-ip>:8086/install
# Wavelog API radio:  http://127.0.0.1:8086/index.php/api/radio
# Gate QSY callback:  http://<pi-ip>:54321   (não 127.0.0.1 se o browser não for o Pi)
# Gate UDP QSO:       apps → UDP 2333 → API Wavelog (log de contatos)
# Boot (imagem SD): ham-cockpit.target (enable no install-station.sh)
#   docker, nginx:80, ham-cockpit, wavelog :8086, waveloggate UDP 2333,
#   ser2net, rigctld@ic705 :4532, AP 192.168.4.1 se não houver Ethernet
# Cartão: image/installer/flash.ps1  |  ISO: image/installer/make-iso.ps1
