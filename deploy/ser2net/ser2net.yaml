%YAML 1.1
---
# ser2net 4 — único processo na TTY. Acessórios (SPE, Palstar, ACOM, …)
# ligam-se a tcp,127.0.0.1,porta. O rádio CAT usa Hamlib, nunca o cabo.
# LAN usa rigctld/ampctld, nunca estas portas cruas.
# Instalar em: /opt/ser2net/ser2net.yaml

connection: &ic705
    accepter: tcp,127.0.0.1,4001
    enable: on
    options:
      kickolduser: true
    connector: serialdev,/dev/serial/by-id/usb-IC-705-if00,115200n81,local

connection: &cat2
    accepter: tcp,127.0.0.1,4002
    enable: on
    options:
      kickolduser: true
    connector: serialdev,/dev/ttyAMA2,38400n81,local

connection: &palstar
    accepter: tcp,127.0.0.1,4003
    enable: on
    options:
      kickolduser: true
    connector: serialdev,/dev/ttyAMA3,9600n81,local

connection: &spe
    accepter: tcp,127.0.0.1,4004
    enable: on
    options:
      kickolduser: true
    connector: serialdev,/dev/serial/by-id/usb-FTDI-SPE,9600n81,local

# TelePost LP-100A — wattímetro vectorial: 115200 8N1, cabo reto DB9 (não null-modem).
# Poll ASCII P; A = alarme ROE; F = Avg/Peak/Tune. Não envie M (muda o ecrã).
connection: &lp100a
    accepter: tcp,127.0.0.1,4006
    enable: on
    options:
      kickolduser: true
    connector: serialdev,/dev/serial/by-id/usb-FTDI-LP100A-if00,115200n81,local

# ACOM 2000A — Director Classic: 1200 8N1, null-modem só 2–3 / 3–2 / 5–5.
# Sem ampctld (Hamlib não tem modelo). RTS+DTR só no pulso RPON (10 s).
connection: &acom2000a
    accepter: tcp,127.0.0.1,4005
    enable: on
    options:
      kickolduser: true
    connector: serialdev,/dev/serial/by-id/usb-FTDI-ACOM2000A-if00,1200n81,local
