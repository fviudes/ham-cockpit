name: Ham Cockpit OS image

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  image:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 150
    permissions:
      contents: write
    env:
      # Imagem completa: embute Wavelog + MariaDB (tar.gz) no .img — sem pull no first-boot.
      SKIP_DOCKER_CACHE: "0"
      CI: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Free disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
            /usr/local/share/powershell /usr/share/swift /opt/hostedtoolcache/CodeQL \
            2>/dev/null || true
          sudo docker system prune -af 2>/dev/null || true
          uname -m
          df -h
      - name: Host tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y qemu-utils cloud-guest-utils \
            parted e2fsprogs xz-utils rsync wget ca-certificates gzip
          # docker no host do bake: pull/save das imagens arm64 para embutir.
          if ! command -v docker >/dev/null 2>&1; then
            sudo apt-get install -y docker.io
            sudo systemctl start docker
          fi
          docker version
          df -h
      - name: Install JS deps
        timeout-minutes: 8
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          pnpm rebuild esbuild
      - name: Build console
        timeout-minutes: 8
        run: |
          set -euo pipefail
          set +e
          timeout --kill-after=15 90 pnpm exec vite build --config vite.config.prod.ts
          rc=$?
          set -e
          if [[ $rc -ne 0 && $rc -ne 124 ]]; then
            echo "vite failed with $rc" >&2
            exit "$rc"
          fi
          if [[ $rc -eq 124 ]]; then
            echo "vite did not exit after writing assets; continuing"
          fi
          test -f dist/public/index.html
          echo "console assets ready"
          pnpm exec esbuild server/index.ts --platform=node --packages=external --bundle --format=esm --outdir=dist
          test -f dist/index.js
          ls -lh dist dist/public
          df -h
      - name: Bake Ubuntu Server 24.04 + Ham Cockpit
        timeout-minutes: 120
        run: sudo -E bash image/appliance/build.sh
      - name: Checksum
        run: |
          ls -lh image/out/
          cat image/out/*.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: Ham-Cockpit-OS
          path: |
            image/out/ham-cockpit-*-raspi.img.xz
            image/out/ham-cockpit-*-raspi.img.xz.sha256
            image/out/mmdvm-arm64.tgz
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
      # mmdvm-arm64.tgz no artifact/Release = byproduct do bake (ponte OTA).
      # Os bins já estão em /usr/local/bin dentro do .img.xz (imagem única).
      - name: Publish GitHub Release
        if: github.repository == 'fviudes/ham-cockpit'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VER_FULL="$(tr -d ' \r\n' < VERSION)"
          VER="$(printf '%s\n' "$VER_FULL" | sed -E 's/^([0-9]+\.[0-9]+\.[0-9]+)(\.[0-9]+)?$/\1/')"
          TAG="v${VER}"
          IMG="$(ls image/out/ham-cockpit-*-raspi.img.xz | head -n 1)"
          SUM="${IMG}.sha256"
          MMDVM="image/out/mmdvm-arm64.tgz"
          NOTES="Imagem Ubuntu Server 24.04 LTS ARM64 (+raspi) com Ham Cockpit ${TAG} para Raspberry Pi 3 / 4 / 5. Stack completo embutido: Docker, ser2net, Hamlib, console, AP Wi-Fi, MMDVM/Nextion em /usr/local/bin, e imagens Docker Wavelog+MariaDB em /opt/wavelog/images (first-boot faz docker load — sem pull obrigatório). Grave no cartão/SSD com o Raspberry Pi Imager (Use custom). Se a Release tiver .part00/.part01, junte antes de gravar (ver .JOIN.txt). O asset mmdvm-arm64.tgz é só ponte OTA para estações antigas."
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --notes "$NOTES"
          else
            gh release create "$TAG" --title "Ham Cockpit ${TAG}" --notes "$NOTES"
          fi
          ls -lh "$IMG" "$SUM"
          BYTES=$(stat -c%s "$IMG")
          # GitHub Release asset ≤ 2 GiB. Imagem completa (Wavelog embutido) pode passar —
          # aí publicamos em partes .part00 + .part01 (juntar com copy /b ou cat).
          LIMIT=2147483648
          PART_SIZE=1900M
          if [[ "$BYTES" -ge "$LIMIT" ]]; then
            echo "AVISO: $IMG tem $BYTES bytes (≥ 2 GiB) — publicando em partes na Release." >&2
            # Remove .img.xz único antigo (sem Docker) para o portal não preferir o incompleto.
            BASE_NAME="$(basename "$IMG")"
            gh release delete-asset "$TAG" "$BASE_NAME" --yes 2>/dev/null || true
            rm -f "${IMG}.part"*
            split -b "$PART_SIZE" -d -a 2 "$IMG" "${IMG}.part"
            ls -lh "${IMG}.part"*
            for p in "${IMG}.part"*; do
              gh release upload "$TAG" "$p" --clobber
            done
            JOIN="${IMG}.JOIN.txt"
            {
              echo "Ham Cockpit ${TAG} — imagem completa acima de 2 GiB (limite por arquivo na Release)."
              echo "Junte as partes e confira o SHA-256:"
              echo
              echo "  Linux/macOS:  cat $(basename "$IMG").part* > $(basename "$IMG")"
              echo "  Windows CMD:  copy /b $(basename "$IMG").part00+$(basename "$IMG").part01 $(basename "$IMG")"
              echo
              echo "SHA-256 esperado:"
              cat "$SUM"
              echo
              echo "O artifact Actions Ham-Cockpit-OS também tem o .img.xz inteiro (retenção 30 dias)."
            } >"$JOIN"
            gh release upload "$TAG" "$JOIN" "$SUM" --clobber
          else
            # Remove partes antigas se esta bake couber num único asset.
            for old in $(gh release view "$TAG" --json assets --jq '.assets[].name' 2>/dev/null || true); do
              if [[ "$old" == *.img.xz.part* || "$old" == *.img.xz.JOIN.txt ]]; then
                gh release delete-asset "$TAG" "$old" --yes 2>/dev/null || true
              fi
            done
            gh release upload "$TAG" "$IMG" "$SUM" --clobber
          fi
          # O bake (sudo) deixa update/mmdvm-arm64.tgz root:root — não copiar por cima.
          # Upload do tgz = ponte OTA; a imagem .img.xz já embute os mesmos bins.
          if [[ -f "$MMDVM" ]]; then
            gh release upload "$TAG" "$MMDVM" --clobber
          fi
          OTA="$(ls update/ham-cockpit-*.tgz 2>/dev/null | head -n 1 || true)"
          if [[ -n "$OTA" && -f "$OTA" ]]; then
            gh release upload "$TAG" "$OTA" --clobber
          fi
      - name: Atualizar o portal (Cloudflare Pages)
        if: github.repository == 'fviudes/ham-cockpit'
        continue-on-error: true
        env:
          CF_PAGES_DEPLOY_HOOK: ${{ secrets.CF_PAGES_DEPLOY_HOOK }}
        run: |
          # A release já está publicada: refaz o deploy do portal para ele mostrar a nova versão da imagem.
          # Sem o secret, o portal ainda se atualiza sozinho no navegador (API pública de releases).
          if [[ -z "${CF_PAGES_DEPLOY_HOOK:-}" ]]; then
            echo "CF_PAGES_DEPLOY_HOOK ausente — deploy do portal não disparado." >&2
            exit 0
          fi
          curl -fsS -X POST "$CF_PAGES_DEPLOY_HOOK" >/dev/null
          echo "Deploy do portal disparado."
