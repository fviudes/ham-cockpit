name: Ham Cockpit OS image

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  image:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    permissions:
      contents: write
    env:
      SKIP_DOCKER_CACHE: "1"
      CI: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Free disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup
          uname -m
          df -h
      - name: Host tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y qemu-utils cloud-guest-utils \
            parted e2fsprogs xz-utils rsync wget ca-certificates
      - name: Install JS deps
        timeout-minutes: 8
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          pnpm rebuild esbuild
      - name: Build console
        timeout-minutes: 8
        run: |
          set -euo pipefail
          set +e
          timeout --kill-after=15 90 pnpm exec vite build --config vite.config.prod.ts
          rc=$?
          set -e
          if [[ $rc -ne 0 && $rc -ne 124 ]]; then
            echo "vite failed with $rc" >&2
            exit "$rc"
          fi
          if [[ $rc -eq 124 ]]; then
            echo "vite did not exit after writing assets; continuing"
          fi
          test -f dist/public/index.html
          echo "console assets ready"
          pnpm exec esbuild server/index.ts --platform=node --packages=external --bundle --format=esm --outdir=dist
          test -f dist/index.js
          ls -lh dist dist/public
          df -h
      - name: Bake Ubuntu Server 24.04 + Ham Cockpit
        timeout-minutes: 100
        run: sudo -E bash image/appliance/build.sh
      - name: Checksum
        run: |
          ls -lh image/out/
          cat image/out/*.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: Ham-Cockpit-OS
          path: |
            image/out/ham-cockpit-*-raspi.img.xz
            image/out/ham-cockpit-*-raspi.img.xz.sha256
            image/out/mmdvm-arm64.tgz
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
      - name: Publish GitHub Release
        if: github.repository == 'fviudes/ham-cockpit'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VER="$(tr -d ' \r\n' < VERSION)"
          TAG="v${VER}"
          IMG="$(ls image/out/ham-cockpit-*-raspi.img.xz | head -n 1)"
          SUM="${IMG}.sha256"
          MMDVM="image/out/mmdvm-arm64.tgz"
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" \
            --title "Ham Cockpit ${TAG}" \
            --notes "Imagem Ubuntu Server 24.04 LTS ARM64 (+raspi) com Ham Cockpit ${TAG} para Raspberry Pi 3 / 4 / 5 (Docker, ser2net, Hamlib, console, AP Wi-Fi). Wavelog baixa as imagens Docker no primeiro boot com Ethernet. Grave no cartão/SSD com o Raspberry Pi Imager (Use custom)."
          ls -lh "$IMG" "$SUM"
          # GitHub Release asset ≤ 2 GiB. Se passar, o artifact Actions ainda fica disponível.
          BYTES=$(stat -c%s "$IMG")
          if [[ "$BYTES" -ge 2147483648 ]]; then
            echo "AVISO: $IMG tem $BYTES bytes (≥ 2 GiB) — upload na Release bloqueado; use o artifact Ham-Cockpit-OS." >&2
            exit 1
          fi
          gh release upload "$TAG" "$IMG" "$SUM" --clobber
          # O bake (sudo) deixa update/mmdvm-arm64.tgz root:root — não copiar por cima.
          if [[ -f "$MMDVM" ]]; then
            gh release upload "$TAG" "$MMDVM" --clobber
          fi
          OTA="$(ls update/ham-cockpit-*.tgz 2>/dev/null | head -n 1 || true)"
          if [[ -n "$OTA" && -f "$OTA" ]]; then
            gh release upload "$TAG" "$OTA" --clobber
          fi
      - name: Atualizar o portal (Cloudflare Pages)
        if: github.repository == 'fviudes/ham-cockpit'
        continue-on-error: true
        env:
          CF_PAGES_DEPLOY_HOOK: ${{ secrets.CF_PAGES_DEPLOY_HOOK }}
        run: |
          # A release já está publicada: refaz o deploy do portal para ele mostrar a nova versão da imagem.
          # Sem o secret, o portal ainda se atualiza sozinho no navegador (API pública de releases).
          if [[ -z "${CF_PAGES_DEPLOY_HOOK:-}" ]]; then
            echo "CF_PAGES_DEPLOY_HOOK ausente — deploy do portal não disparado." >&2
            exit 0
          fi
          curl -fsS -X POST "$CF_PAGES_DEPLOY_HOOK" >/dev/null
          echo "Deploy do portal disparado."
