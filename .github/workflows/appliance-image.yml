name: Ham Cockpit OS image

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  image:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 75
    permissions:
      contents: write
    env:
      SKIP_DOCKER_CACHE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Free disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup
          uname -m
          df -h
      - name: Host tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y qemu-utils cloud-guest-utils \
            parted e2fsprogs xz-utils rsync wget ca-certificates
      - name: Build console
        timeout-minutes: 15
        run: |
          pnpm install --frozen-lockfile
          pnpm rebuild esbuild
          pnpm exec vite build
          ./node_modules/.bin/esbuild server/index.ts --platform=node --packages=external --bundle --format=esm --outdir=dist
          test -f dist/index.js
          ls -lh dist
      - name: Bake Ubuntu Server 24.04 + Ham Cockpit
        run: sudo -E bash image/appliance/build.sh
      - name: Checksum
        run: |
          ls -lh image/out/
          cat image/out/*.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: Ham-Cockpit-OS
          path: |
            image/out/ham-cockpit-*-raspi.img.xz
            image/out/ham-cockpit-*-raspi.img.xz.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
      - name: Publish GitHub Release
        if: github.repository == 'fviudes/ham-cockpit'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VER="$(tr -d ' \r\n' < VERSION)"
          TAG="v${VER}"
          IMG="$(ls image/out/ham-cockpit-*-raspi.img.xz | head -n 1)"
          SUM="${IMG}.sha256"
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" \
            --title "Ham Cockpit ${TAG}" \
            --notes "Imagem Ubuntu Server 24.04 LTS ARM64 com Ham Cockpit ${TAG} (Docker, ser2net, Hamlib, console). Wavelog baixa as imagens Docker no primeiro boot com Ethernet. Grave no cartão/SSD com o Raspberry Pi Imager (Use custom)."
          gh release upload "$TAG" "$IMG" "$SUM" --clobber
