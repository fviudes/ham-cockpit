name: Ham Cockpit OS image

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Free disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup
          df -h
      - name: Host tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y qemu-user-static qemu-utils cloud-guest-utils \
            parted e2fsprogs zerofree xz-utils rsync wget ca-certificates
      - name: QEMU arm64 binfmt
        run: docker run --privileged --rm tonistiigi/binfmt --install all
      - name: Build console
        run: pnpm install && pnpm build
      - name: Bake Ubuntu Server 24.04 + Ham Cockpit
        run: sudo -E bash image/appliance/build.sh
      - name: Checksum
        run: |
          ls -lh image/out/
          cat image/out/*.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: Ham-Cockpit-OS
          path: |
            image/out/ham-cockpit-*-raspi.img.xz
            image/out/ham-cockpit-*-raspi.img.xz.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
      - name: Publish GitHub Release
        if: github.repository == 'fviudes/ham-cockpit'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VER="$(tr -d ' \r\n' < VERSION)"
          TAG="v${VER}"
          IMG="$(ls image/out/ham-cockpit-*-raspi.img.xz | head -n 1)"
          SUM="${IMG}.sha256"
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" \
            --title "Ham Cockpit ${TAG}" \
            --notes "Imagem Ubuntu Server 24.04 LTS ARM64 com Ham Cockpit ${TAG} (Docker, Wavelog, WaveLogGate, ser2net, Hamlib). Grave no cartão/SSD com o Raspberry Pi Imager (Use custom)."
          gh release upload "$TAG" "$IMG" "$SUM" --clobber
