name: MMDVM ARM64 binaries

# Compila g4klx + NextionDriver no runner ARM e publica update/mmdvm-arm64.tgz
# para o OTA instalar em estações sem bake recente.
on:
  workflow_dispatch:
  push:
    paths:
      - "deploy/mmdvm/build-binaries.sh"
      - ".github/workflows/mmdvm-binaries.yml"

jobs:
  binaries:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Build MMDVM stack
        run: |
          set -euo pipefail
          sudo MMDVM_FORCE=1 MMDVM_PURGE_BUILD=0 bash deploy/mmdvm/build-binaries.sh
          for b in MMDVMHost DMRGateway YSFGateway ircddbgatewayd NextionDriver; do
            test -x "/usr/local/bin/$b"
            ls -lh "/usr/local/bin/$b"
          done
      - name: Pack mmdvm-arm64.tgz
        run: |
          set -euo pipefail
          STAGE="$(mktemp -d)"
          mkdir -p "$STAGE/bin" "$STAGE/etc"
          for b in MMDVMHost DMRGateway YSFGateway ircddbgatewayd NextionDriver; do
            install -m 0755 "/usr/local/bin/$b" "$STAGE/bin/$b"
          done
          for f in groups.txt users.csv YSFHosts.txt; do
            if [[ -f "/usr/local/etc/$f" ]]; then
              install -m 0644 "/usr/local/etc/$f" "$STAGE/etc/$f"
            fi
          done
          mkdir -p update
          tar -C "$STAGE" -czf update/mmdvm-arm64.tgz bin etc
          ls -lh update/mmdvm-arm64.tgz
          tar -tzf update/mmdvm-arm64.tgz
      - uses: actions/upload-artifact@v4
        with:
          name: mmdvm-arm64
          path: update/mmdvm-arm64.tgz
          if-no-files-found: error
          retention-days: 90
      - name: Commit to update/ on main
        if: github.ref == 'refs/heads/main' && github.repository == 'fviudes/ham-cockpit'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add update/mmdvm-arm64.tgz
          if git diff --cached --quiet; then
            echo "mmdvm-arm64.tgz sem mudanças"
            exit 0
          fi
          git commit -m "Publish MMDVM ARM64 binaries for OTA (mmdvm-arm64.tgz)."
          git push
